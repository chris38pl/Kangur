id: theme-only-grill-and-pizza
scenarioVersion: 1
name: Grill / pizza purpose phrases invent nothing
adapter: text-ingest
description: >
  Meal/purpose grammar without listed products — empty item set.
input:
  locale: pl
  sourceLabel: text
  rawInput: Składniki do pizzy. Na grilla.
expectations:
  mustExclude:
    - Mąka
    - Drożdże
    - Ser
    - Ketchup
    - Kiełbasa
    - Węgiel
hardRules:
