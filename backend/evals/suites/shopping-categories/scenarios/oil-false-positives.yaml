id: oil-false-positives
scenarioVersion: 1
name: Non-oils must not be forced to other
adapter: shopping-categories
description: >
  Guard against contains()-style overmatching (olejek, butter, olives).
input:
  locale: pl
  categoryCases:
    - { name: "Olejek waniliowy", aiCategory: pantry, expectedCategory: pantry }
    - { name: "Olejek eteryczny", aiCategory: other, expectedCategory: other }
    - { name: "Masło", aiCategory: dairy, expectedCategory: dairy }
    - { name: "Butter", aiCategory: dairy, expectedCategory: dairy }
    - { name: "Oliwki czarne", aiCategory: vegetables, expectedCategory: vegetables }
    - { name: "Black olives", aiCategory: vegetables, expectedCategory: vegetables }
    - { name: "Mąka pszenna", aiCategory: pantry, expectedCategory: pantry }
    - { name: "Flour", aiCategory: pantry, expectedCategory: pantry }
    - { name: "Makaron spaghetti", aiCategory: pantry, expectedCategory: pantry }
    - { name: "Passata", aiCategory: sauces, expectedCategory: sauces }
    - { name: "Piwo", aiCategory: alcohol, expectedCategory: alcohol }
    - { name: "Melon", aiCategory: fruit, expectedCategory: fruit }
hardRules:
  - id: H001
    type: json_valid
  - id: H002
    type: category_enum
  - id: H013
    type: no_crash
  - id: H016
    type: expected_categories
softRules: []
infoRules:
  - id: I004
    type: item_count
